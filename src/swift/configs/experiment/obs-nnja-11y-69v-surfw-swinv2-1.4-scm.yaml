# @package _global_
# Swift-B (SCM), 11y NNJA, 69 variables, 12h step -- WITH the surface-weight
# override that obs-nnja-11y-69v-swinv2-1.4-scm.yaml's header predicted would
# be needed. That run is the baseline; it is left untouched so its (negative)
# numbers stay reproducible. Everything below is identical to it except
# `loss.var_weights`.
#
# WHY. Scoring checkpoint-003400 of the baseline on the 714-window test split
# (masked RMSE, observed cells only, 12h, 00/12Z) gave 18/69 variables beating
# persistence and 12/69 beating diurnal climatology. The surface block split
# in two rather than degrading uniformly:
#
#   variable        model    persistence   diurnal   model/full-field-std
#   2t              3.6389     6.1557      3.3223          0.243   learned
#   10m u           2.5001     2.4853      2.3219          0.875
#   10m v           2.5759     2.5209      2.4115          0.925
#   msl          1131.0987   455.1215    532.7024          1.105   WORST OF 69
#
# msl is the only channel in all 69 whose RMSE exceeds its own full-field std
# -- it is worse than predicting the climatological mean. Note this is NOT what
# a merely undertrained channel looks like under a residual target, where the
# degenerate prediction is zero and zero IS persistence. In a consistency model
# the degenerate output is the un-denoised noise prior, so a starved channel
# lands ABOVE persistence, not at it. Decomposing model error into persistence
# plus an orthogonal excess (both in units of the 12h increment std):
#
#   msl          model 2.28   persist 0.92   excess 2.09
#   z500         model 1.81   persist 1.49   excess 1.04
#   2t           model 0.60   persist 1.01   excess 0.00
#
# CAVEAT -- READ BEFORE TRUSTING THIS RUN. Dilution is a real effect but it is
# NOT the whole story, and this config is a test of it, not a fix known to work.
# Across all 69 variables the rank correlation between log(loss weight) and
# excess noise is only -0.287. msl carries the same 1.59% weight as the two 10m
# winds, which are near-persistence, while several 0.13%-weight upper-air
# channels have zero excess. So msl is an outlier on some axis other than
# weight. If msl is still above persistence after this run, stop reweighting
# and look at the channel itself -- its standardization is the next suspect
# (normalize_std 1023.97, normalize_diff_std_12 495.235, mean 101387: the raw
# field is ~10^5 with a 12h increment ~500, a dynamic range 200x tighter than
# the field, far more extreme than any other variable here).
#
# THE ARITHMETIC. `_calculate_variable_weights` normalises to sum 1, and
# `overrides` replaces base-table entries BEFORE that normalisation, so the
# surface entries cannot simply be set to their old shares -- raising them also
# raises the denominator. Base table: 2t 1.0, the other three surface vars 0.1
# (sum 1.3); each upper-air variable's 13 level weights sum to 1.0 (5 vars, sum
# 5.0). Multiplying all four surface entries by k gives:
#
#     k        2t     each wind/msl   surface blk   upper air   2t vs default
#   1.000    15.87%       1.59%          20.63%       79.37%       1.00x
#   3.846    38.46%       3.85%          50.00%       50.00%       2.42x   <--
#   5.769    46.15%       4.62%          60.00%       40.00%       2.91x
#  12.804    59.15%       5.92%          76.90%       23.10%       3.73x
#
# The surface-only 11y run had 2t at 76.9% and each other surface var at 7.69%.
# THAT IS NOT REACHABLE HERE AT ANY k -- the 65 upper-air channels never leave
# the denominator, so 2t asymptotes at 76.9%/1.3 = 59.2%. "Restore" therefore
# has to mean a choice about how much upper air to give up, and k = 3.846 is
# the largest restoration that does not make the 65 channels this run exists to
# produce the minority of the gradient. It buys each surface variable 2.42x its
# baseline share. If the surface metrics improve but upper air degrades, k is
# the one knob to back off; if surface does not move at all, the hypothesis is
# wrong and the caveat above is the thing to pursue.
defaults:
  - /data: obs-nnja-11y-69v-1.4
  - /model: swinv2
  - /loss: scm
  - /precond: pass
  - /solver: scm
  - override /loss/noise: loguniform
  - override /optimizer: muon

distill: null

optimizer:
  lr: 0.0126

loss:
  # k = 3.846 applied to the base entries (2t 1.0, others 0.1). See header --
  # these are pre-normalisation values, not shares. Unknown keys raise KeyError,
  # so a typo here fails loudly at construction rather than silently.
  var_weights:
    2m_temperature: 3.846
    10m_u_component_of_wind: 0.3846
    10m_v_component_of_wind: 0.3846
    mean_sea_level_pressure: 0.3846
  # measured on the full 11y against swift_root_69v; unchanged from the
  # baseline. Reweighting does not change the data scale.
  sigma_data: 0.1416
  tangent_warmup_kimg: 679
  noise:
    sigma_max: 200

precond:
  sigma_data: 0.1416

solver:
  sigma_max: 200
  # MUST match the data interval (12h -> 1.2). Getting this wrong makes every
  # validation number silently wrong; see the baseline config's note.
  auxiliary: 1.2

model:
  window_size: [16, 16]
  shift_size: [8, 8]
  patch_size: [2, 2]
  depth: 6
  dim: 384
  heads: 6

data:
  batch_size: 48
  data_workers: 7
  val_local_batch_size: 4

trainer:
  # Identical to the baseline so the two runs are directly comparable: 3400 kimg
  # at global batch 120 (10 nodes, LOCAL_BATCH_SIZE=1) is 28,333 steps / 518
  # epochs, ~0.8h -- which does NOT fit one 1h job with startup, so this is two
  # parts (PARTID=0 then PARTID=1) exactly as the baseline was.
  total_kimg: 3400
  ema_halflife_kimg: 114
  lr_rampup_kimg: 454
  lr_min_factor: 0.0001
  lr_cosine_anneal: true
  kimg_per_tick: 1
  checkpoint_ticks: 10
  val_ticks: 25
  val_target_interval: 8

experiment_name: obs-nnja-11y-69v-surfw-swinv2-1.4-scm
