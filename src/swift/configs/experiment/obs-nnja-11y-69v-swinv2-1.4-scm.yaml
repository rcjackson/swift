# @package _global_
# Swift-B (SCM) on 11 years of NNJA observations, **all 69 variables**, 12h step.
#
# The surface-only 11-year run is the baseline this has to beat on 2t/msl while
# additionally predicting 65 upper-air channels. Differences from
# obs-nnja-11y-swinv2-1.4-scm.yaml, and why:
#
# **12h step, 00/12Z inits.** Set in the data config; see its header for the
# measurements. Short version: radiosondes launch at 00/12Z, so a 6h step puts
# only 3.9% of upper-air loss mass on a real observed increment, against 67% at
# 12h from 00/12Z. This is the single most consequential choice here.
#
# **Half the samples.** init_hours halves the index and the 12h reach trims a
# little more, so an epoch is roughly half the surface run's 13.1 kimg. The
# kimg-denominated schedules below are rescaled to preserve the same EPOCH
# counts the surface run used -- the calibration trap that cost the pilot: every
# schedule here is in kimg but behaves in epochs.
#
# **sigma_data is 0.1416, not 0.31.** That 0.31 was measured on 4 surface channels
# at ~11% fill. sigma_data is the real data scale in the SCM noise schedule, not
# a free knob -- set it wrong and the training noise levels no longer straddle
# the signal. With 65 more channels at ~0.9% fill, nearly every cell of nearly
# every channel is an unpaired zero, and the realised std of the target tensor
# drops to 0.1416 -- a factor of 2.2 below the surface value.
#
# MEASURED on the full 11 years (2026-09-25), against the real stats in
# swift_root_69v: 0.1416. The earlier 0.137 was a 2010-only estimate over 606
# samples; the full-period value is 3.4% higher. Both are far enough from 0.31
# that the correction matters much more than the difference between them.
#   work/nnja/measure_sigma_data.py --data obs-nnja-11y-69v-1.4 --root <root>
#
# **Variable weights need no override, but they DO shift.** swift's own table
# covers all 69 (pressure-level weights are level/sum(levels)), so nothing has
# to be added. But `_calculate_variable_weights` normalises to sum 1, so adding
# 65 channels dilutes the 4 surface ones:
#
#   variable          surface-only run   69-variable run
#   2m_temperature          76.9%             15.9%
#   each wind / msl          7.7%              1.59%
#   all 65 upper-air           --             79.4%
#
# 2t gets **4.8x less gradient** here than in the run this has to beat on 2t and
# msl. If the surface metrics regress, check this before concluding the 12h step
# or the extra channels are at fault -- it is the most likely cause and it is a
# one-line `loss.var_weights` override to test (that mechanism was added for the
# wind-weight ablation). Left at the default deliberately: the point of this run
# is a 69-variable reanalysis, not a surface run with passengers.
defaults:
  - /data: obs-nnja-11y-69v-1.4
  - /model: swinv2
  - /loss: scm
  - /precond: pass
  - /solver: scm
  - override /loss/noise: loguniform
  - override /optimizer: muon

distill: null

optimizer:
  # 0.008 is the surface run's value at global batch 48; this runs at 120. Linear
  # scaling says 0.02, but this project already diverged once at high lr, so
  # sqrt scaling is the first try: 0.008 * sqrt(2.5) = 0.0126. Read the first
  # job's loss curve before chaining -- if it diverges, fall back to 0.008.
  lr: 0.0126

loss:
  # measured, not copied -- see header
  sigma_data: 0.1416
  tangent_warmup_kimg: 679   # same fraction of total_kimg as the surface run
  noise:
    sigma_max: 200

precond:
  sigma_data: 0.1416

solver:
  sigma_max: 200

model:
  window_size: [16, 16]
  shift_size: [8, 8]
  patch_size: [2, 2]
  depth: 6
  dim: 384
  heads: 6

data:
  batch_size: 48
  data_workers: 7
  val_local_batch_size: 4

trainer:
  # Sized for **10 nodes on debug-scaling at LOCAL_BATCH_SIZE=1** (global batch
  # 120), which is how the full Swift was trained. Two conversions matter and
  # they pull in opposite directions:
  #
  #   epochs  init_hours halves the index, so an epoch is ~6.6 kimg here against
  #           13.1 for the surface run.
  #   steps   total_kimg is in IMAGES. Global batch 120 vs the surface run's 48
  #           means each kimg buys 2.5x FEWER optimizer steps.
  #
  # Matching the surface baseline's 70,083 steps at batch 120 needs 8410 kimg.
  # That is 1281 epochs, which is far past where an 11-year dataset has anything
  # left to teach -- so this is capped at 3400 kimg (28,333 steps, 518 epochs,
  # ~0.8 h of a 1h job) and the loss curve decides whether to extend. The
  # surface run's own curve was flat well before its 3364.
  #
  # At 1 node / LOCAL_BATCH_SIZE=4 (global batch 48) these same figures give
  # 70,833 steps and 5.2x the walltime -- correct but ~8 jobs. Prefer 10 nodes.
  total_kimg: 3400
  ema_halflife_kimg: 114
  lr_rampup_kimg: 454
  lr_min_factor: 0.0001
  lr_cosine_anneal: true
  kimg_per_tick: 1
  checkpoint_ticks: 10
  val_ticks: 25
  val_target_interval: 8

experiment_name: obs-nnja-11y-69v-swinv2-1.4-scm
